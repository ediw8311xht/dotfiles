
# vi:ft=i3:syntax=i3:
#-------------------------------------------------------------------------------------------|
#------------<[--MAXIMILIAN-BALLARD--]>-----------------<[--BINDINGS--]>--------------------|
#-------------------------------------------------------------------------------------------|
# i3 config file (v4)
#-------------------------------------------------------------------------------------------|
# bindcode [keycode] to bind by keycode
# Example:
#   bindcode 133 focus up
#---------------------------------------------------RESERVED--------------------------------|
#   c               reserved
#   i               reserved
#   m               reserved
#   minus           reserved
#   semicolon       reserved
#   t               reserved
#   u               reserved
#   comma           reserved
#---------------------------------------------------BINDINGS--------------------------------|

# temporary
bindsym --release $mod+Menu   exec $SCRIPT_send_key --mark "$mark_quickswitch" 'ctrl+shift+R'

# $Br Menu            $_  mode    run_program
$Br Down            $_  exec    "pamixer --decrease 5"
$Br Return          $_  exec    /usr/bin/kitty
$Br Up              $_  exec    "pamixer --increase 5"
$Br period          $_  gaps    inner all toggle $IN_GAPS, gaps bottom all toggle $BOT_GAPS, gaps left all toggle $L_GAPS, gaps top all toggle $TOP_GAPS, gaps right all toggle $R_GAPS
$Br slash           $_  mode    polymove
$Br space           $B1 focus   mode_toggle
$Br a               $B1 focus   parent
$Br b               $B1 floating toggle ; move position center
$Br d               $_  exec    $SCRIPT_dmenu -run
$Br e               $_  layout  toggle split
$Br f               $_  mode    mousemove
$Br g               $_  exec    kitty nvim
$Br h               $B1 focus   left
$Br j               $B1 focus   down
$Br k               $B1 focus   up
$Br l               $B1 focus   right
$Br m               $_  exec    i3-input -F '[con_mark="%s"] focus' -l 1 -P 'Goto Mark: '
$Br o               $_  fullscreen
$Br p               $_  exec    dunstctl close-all
$Br r               $_  mode    resize
$Br s               $_  layout  stacking
$Br v               $_  split   v
$Br w               $_  layout  tabbed
$Br x               $_  exec    $SCRIPT_clipboard "DATE"
$Br y               $_  mode    freekey
$Br z               $_  mode    zathura
$Br_CTRL m          $_  mode    marks

$SF Delete          $_  exec    $SCRIPT_wallpaper  --pargs --bg-scale
$SF Down            $_  exec    $SCRIPT_wallpaper  "DOWN"
$SF End             $_  exec    $SCRIPT_wallpaper  --pargs --bg-fill
$SF Home            $_  exec    $SCRIPT_wallpaper  --pargs --bg-tile
$SF Insert          $_  exec    $SCRIPT_wallpaper  --pargs --bg-max
$SF Left            $_  exec    $SCRIPT_wallpaper  "LEFT"
$SF Next            $_  exec    $SCRIPT_wallpaper  --pargs --bg-center
$SF Prior           $_  exec    $SCRIPT_wallpaper  "DMENU"
$SF Return          $_  exec    /usr/bin/brave
$SF Right           $_  exec    $SCRIPT_wallpaper  "RIGHT"
$SF Up              $_  exec    $SCRIPT_wallpaper  "UP"
$SF greater         $_  exec    $SCRIPT_zathura -p+
$SF less            $_  exec    $SCRIPT_zathura -p-
$SF slash           $_  exec    $SCRIPT_zathura -d
$SF b               $_  exec    $SCRIPT_bluetooth
$SF d               $_  mode    run_program
$SF h               $B1 move    left  50px
$SF i               $_  mode    mpv
$SF j               $B1 move    down  50px
$SF k               $B1 move    up    50px
$SF l               $B1 move    right 50px
$SF m               $_  exec    i3-input -F 'mark %s' -l 1 -P 'Mark: '
$SF p               $_  exec    /usr/bin/brave --incognito
$SF q               $_  kill
$SF v               $_  split   h
$SF x               $_  exec    $SCRIPT_clipboard "DATE" "TIME"
$SF_CTRL e          $_  exec    $HOME/bin/custom_exit.sh
$SF_CTRL greater    $_  gaps    inner all  plus 10
$SF_CTRL h          $B1 move    left  10px
$SF_CTRL j          $B1 move    down  10px
$SF_CTRL k          $B1 move    up    10px
$SF_CTRL l          $B1 move    right 10px
$SF_CTRL less       $_  gaps    inner all minus 10

# hard refresh
bindsym --release  $mod+Ctrl+minus exec $SCRIPT_send_key --mark "$mark_quickswitch" 'ctrl+shift+r'
