# i3 config file (v4)
#-------------------------------------------------------------------------------------------|
mode "run_program" {
    bindsym b               $EXC $SCRIPT_bluetooth      ; mode "default"
    bindsym c               $EXC chromium               ; mode "default"
    bindsym d               $EXC deluge                 ; mode "default"
    bindsym f               $EXC firefox                ; mode "default"
    bindsym g               $EXC geogebra               ; mode "default"
    bindsym k               $EXC keepassxc              ; mode "default"
    bindsym l               $EXC librewolf              ; mode "default"
    bindsym Shift+l         $EXC libreoffice            ; mode "default"
    bindsym o               $EXC obsidian               ; mode "default"
    bindsym p               $EXC gthumb                 ; mode "default"
    bindsym r               $EXC rnote                  ; mode "default"
    bindsym s               $EXC strawberry             ; mode "default"
    bindsym t               $EXC thunar                 ; mode "default"
    bindsym x               $EXC xournalpp              ; mode "default"
    bindsym y               $EXC freetube               ; mode "default"
    bindsym z               $EXC $SCRIPT_zathura -O     ; mode "default"

    bindsym Shift+b         $EXC $SCRIPT_border         ; mode "default"
    bindsym Shift+d         $EXC $SCRIPT_dmenu -run-def ; mode "default"
    bindsym Shift+r         $EXC rofi -show drun        ; mode "default"
    bindsym Shift+z         $EXC $SCRIPT_zathura -H     ; mode "default"
    bindsym Escape          mode "default"
}
    # bindsym Shift+r         $EXC $SCRIPT_key_mouse -r      ; mode "default"
    # bindsym s               $EXC sioyek                 ; mode "default"
