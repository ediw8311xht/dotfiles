#---------------------------------------------------SET-MACROS------------------------------|
set $MovePosCenter      move    position center
set $MoveUp             move    up
set $MoveDown           move    down
set $MoveLeft           move    left
set $MoveRight          move    right
set $ResizeSet          resize  set
#---------------------------------------------------MARK------------------------------------|
mode "marks" {
  bindsym Shift+m         exec i3-input -F 'mark %s' -l 1 -P 'Set Mark: '                                           ; mode "default"
  bindsym Shift+s         mark $mark_quickswitch                                                                    ; mode "default"
  bindsym d               [con_id=__focused__] unmark                                                               ; mode "default"
  bindsym s               exec i3-input -F 'exec $SCRIPT_send_key --mark "$mark_quickswitch" "%s"' -P 'Send Keys: ' ; mode "default"
  bindsym m               exec i3-input -F '[con_mark="%s"] focus' -l 1 -P 'Goto Mark: '                            ; mode "default"
  bindsym Ctrl+c          mode "default"
  bindsym Escape          mode "default"
  bindsym $mod+Ctrl+m     mode "default"
}
#---------------------------------------------------POLYBAR-MOVE----------------------------|
mode "polymove" {
  # Movement
  bindsym Shift+j         exec $SCRIPT_polybar   "MOVE" "DOWN"  "MOVE" "LEFT"
  bindsym Shift+k         exec $SCRIPT_polybar   "MOVE" "DOWN"  "MOVE" "RIGHT"
  bindsym j               exec $SCRIPT_polybar   "MOVE" "UP"    "MOVE" "LEFT"
  bindsym k               exec $SCRIPT_polybar   "MOVE" "UP"    "MOVE" "RIGHT"

  # Toggle
  bindsym semicolon       exec $SCRIPT_polybar   "TOGGLE" ; mode "default"
  bindsym t               exec $SCRIPT_polybar   "TDMENU" ; mode "default"
  bindsym Shift+semicolon exec $SCRIPT_polybar   "DMENU"  ; mode "default"

  # EXIT
  bindsym slash           mode "default"
  bindsym $mod+slash      mode "default"
  bindsym Return          mode "default"
  bindsym Ctrl+c          mode "default"
  bindsym Escape          mode "default"
}

