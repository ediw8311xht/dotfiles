#---------------------------------------------------RESIZE---------------------------------------------------------#
mode "resize" {
  bindsym e layout toggle split
  #-----------------------------------
  bindsym bracketleft         $ResizeSet 50ppt 50ppt , $MovePosCenter
  bindsym bracketright        $ResizeSet 25ppt 25ppt , $MovePosCenter
  bindsym Shift+bracketleft   resize shrink height 30px; resize shrink width 50px; $MovePosCenter
  bindsym Shift+bracketright  resize grow   height 30px; resize grow   width 50px; $MovePosCenter
  #-----------------------------------
  bindsym Shift+equal     $ResizeSet $DefaultSize, $MovePosCenter
  bindsym Return          exec $balance_workspace
  bindsym equal           $MovePosCenter
  # implement better move position in script
  bindsym 0               $ResizeSet $SmallSize  , $MovePosCenter, $MoveLeft  25ppt, $MoveDown 20ppt
  bindsym minus           $ResizeSet $SmallSize  , $MovePosCenter, $MoveLeft  25ppt, $MoveUp   20ppt
  bindsym Shift+0         $ResizeSet $SmallSize  , $MovePosCenter, $MoveRight 25ppt, $MoveDown 20ppt
  bindsym Shift+minus     $ResizeSet $SmallSize  , $MovePosCenter, $MoveRight 25ppt, $MoveUp   20ppt
  #-----------------------------------
  bindsym h               resize    shrink   width   40px  or  4ppt
  bindsym j               resize    shrink   height  40px  or  4ppt
  bindsym k               resize    grow     height  40px  or  4ppt
  bindsym l               resize    grow     width   40px  or  4ppt
  bindsym Shift+h         resize    shrink   width    1px  or  2ppt
  bindsym Shift+j         resize    shrink   height   1px  or  2ppt
  bindsym Shift+k         resize    grow     height   1px  or  2ppt
  bindsym Shift+l         resize    grow     width    1px  or  2ppt
  #-----------------------------------
  bindsym m               move      position mouse
  # resize based on user input (w/dmenu)
  bindsym r               exec printf '%s\n' '$SmallSize' '$DefaultSize' | $SCRIPT_DMENU -p 'new dimensions for window: ' --run-with-xargs 'i3-msg resize set'
  #-----------------------------------
  bindsym a               $MoveLeft  40px, resize    grow     width   40px
  bindsym s               $MoveDown  40px, resize    shrink   height  40px
  bindsym d               $MoveUp    40px, resize    grow     height  40px
  bindsym f               $MoveRight 40px, resize    shrink   width   40px
  #-----------------------------------
  bindsym $mod+r          mode "default"
  bindsym Ctrl+c          mode "default"
  bindsym Escape          mode "default"
}

#---------------------------------------------------MOUSE-MOVEMENT-------------------------------------------------#
set $MOUSE_MOVE_BIND\
  bindsym Shift+h         "exec xdotool mousemove_relative --polar 270     5"\
  bindsym Shift+j         "exec xdotool mousemove_relative --polar 180     5"\
  bindsym Shift+k         "exec xdotool mousemove_relative --polar 0       5"\
  bindsym Shift+l         "exec xdotool mousemove_relative --polar 90      5"\
  bindsym h               "exec xdotool mousemove_relative --polar 270    50"\
  bindsym j               "exec xdotool mousemove_relative --polar 180    50"\
  bindsym k               "exec xdotool mousemove_relative --polar 0      50"\
  bindsym l               "exec xdotool mousemove_relative --polar 90     50"\
  bindsym i               "exec xdotool mousemove_relative --polar 290    50"\
  bindsym o               "exec xdotool mousemove_relative --polar 70     50"\
  bindsym comma           "exec xdotool mousemove_relative --polar 250    50"\
  bindsym period          "exec xdotool mousemove_relative --polar 110    50"\
  bindsym f               "exec xdotool click 1"\
  bindsym d               "exec xdotool click 3"\
  bindsym s               "exec xdotool click 2"\
  bindsym g               "exec xdotool click 4"\
  bindsym v               "exec xdotool click 5"

  #bindcode 44 133 "exec xdotool mousemove_relative --polar 270   100"\
  #bindsym grave+j         "exec xdotool mousemove_relative --polar 180   100"\
  #bindsym grave+k         "exec xdotool mousemove_relative --polar 0     100"\
  #bindsym grave+l         "exec xdotool mousemove_relative --polar 90    100"\

mode "mousedown1" {
  $MOUSE_MOVE_BIND
  bindsym Escape          exec "xdotool mouseup 1"   ; mode "mousemove"
  bindsym $mod+f          exec "xdotool mouseup 1"   ; mode "default"
}

mode "mousedown2" {
  $MOUSE_MOVE_BIND
  bindsym Escape          exec "xdotool mouseup 2"   ; mode "mousemove"
  bindsym $mod+f          exec "xdotool mouseup 2"   ; mode "default"
}

mode "mousedown3" {
  $MOUSE_MOVE_BIND
  bindsym Escape          exec "xdotool mouseup 3"   ; mode "mousemove"
  bindsym $mod+f          exec "xdotool mouseup 3"   ; mode "default"
}

mode "mousemove" {
  $MOUSE_MOVE_BIND
  #------------------------IN-HERE-SINCE-CAN'T-PUT-MACRO-IN-MACRO W
  bindsym $mod+h          "exec xdotool mousemove_relative --polar 270   100"
  bindsym $mod+j          "exec xdotool mousemove_relative --polar 180   100"
  bindsym $mod+k          "exec xdotool mousemove_relative --polar 0     100"
  bindsym $mod+l          "exec xdotool mousemove_relative --polar 90    100"
  bindsym $mod+Shift+h    "exec xdotool mousemove_relative --polar 270   3"
  bindsym $mod+Shift+j    "exec xdotool mousemove_relative --polar 180   3"
  bindsym $mod+Shift+k    "exec xdotool mousemove_relative --polar 0     3"
  bindsym $mod+Shift+l    "exec xdotool mousemove_relative --polar 90    3"
  #------------------------IN-HERE-SINCE-CAN'T-PUT-MACRO-IN-MACRO
  bindsym f               exec xdotool click 1
  bindsym d               exec xdotool click 3
  bindsym s               exec xdotool click 2
  bindsym r               exec "xdotool mousedown 1" ; mode "mousedown1"
  bindsym w               exec "xdotool mousedown 2" ; mode "mousedown2"
  bindsym e               exec "xdotool mousedown 3" ; mode "mousedown3"
  bindsym $mod+space      focus floating; move position mouse
  bindsym Escape          mode "default"
  bindsym $mod+f          mode "default"
}


mode "mpv" {
  bindsym f               exec "socat - /tmp/mpvsocket <<< 'cycle fullscreen'"
  bindsym s               exec "socat - /tmp/mpvsocket <<< 'cycle-values sub no auto'"
  bindsym h               exec "socat - /tmp/mpvsocket <<< 'seek -1'"
  bindsym j               exec "socat - /tmp/mpvsocket <<< 'add volume -1'"
  bindsym k               exec "socat - /tmp/mpvsocket <<< 'add volume  1'"
  bindsym l               exec "socat - /tmp/mpvsocket <<< 'seek  1'"
  bindsym o               exec "socat - /tmp/mpvsocket <<< 'script-message-to uosc toggle-elements top_bar,timeline'"
  bindsym p               exec "socat - /tmp/mpvsocket <<< 'cycle pause'" ; mode "default"
  bindsym space           exec "socat - /tmp/mpvsocket <<< 'cycle pause'" ; mode "default"
  bindsym Return          exec "socat - /tmp/mpvsocket <<< 'cycle pause'" ; mode "default"
  bindsym $mod+q          exec "socat - /tmp/mpvsocket <<< 'quit'" ; mode "default"
  bindsym Shift+s         exec "socat - /tmp/mpvsocket <<< 'cycle sub'"
  bindsym Shift+h         exec "socat - /tmp/mpvsocket <<< 'seek -5'"
  bindsym Shift+l         exec "socat - /tmp/mpvsocket <<< 'seek  5'"
  bindsym Shift+less      exec "socat - /tmp/mpvsocket <<< 'playlist-prev'"
  bindsym Shift+greater   exec "socat - /tmp/mpvsocket <<< 'playlist-next'"
  bindsym Shift+minus     exec "socat - /tmp/mpvsocket <<< 'script-binding skip-key'"
  bindsym bracketleft     exec "socat - /tmp/mpvsocket <<< 'add chapter -1'"
  bindsym bracketright    exec "socat - /tmp/mpvsocket <<< 'add chapter  1'"
  bindsym Escape          mode "default"
}

mode "zathura" {
  bindsym d               exec $SCRIPT_zathura '--set-dmenu'
  bindsym h               exec $SCRIPT_zathura '--history'
  bindsym g               exec $SCRIPT_zathura '--get'
  bindsym o               exec $SCRIPT_zathura '--open'
  bindsym r               exec $SCRIPT_zathura '--recolor'

  bindsym Shift+greater   exec $SCRIPT_zathura '--nextpage'
  bindsym Shift+less      exec $SCRIPT_zathura '--prevpage'

  bindsym Shift+h         exec $SCRIPT_zathura '--history-new'
  bindsym Shift+equal     exec $SCRIPT_zathura '--nextpage'
  bindsym Shift+minus     exec $SCRIPT_zathura '--prevpage'
  bindsym Shift+o         exec $SCRIPT_zathura '--open-new'
  bindsym Shift+u         exec $SCRIPT_zathura '--update-database' ; mode "default"

  bindsym Escape          mode "default"
}

mode "run_program" {
  bindsym a               exec rofi -show drun            ; mode "default"
  bindsym b               exec $SCRIPT_bluetooth          ; mode "default"
  bindsym c               exec octave --gui               ; mode "default"
  bindsym d               exec $SCRIPT_dmenu -run-def     ; mode "default"
  bindsym e               exec emacs                      ; mode "default"
  bindsym f               exec firefox                    ; mode "default"
  bindsym g               exec geogebra                   ; mode "default"
  bindsym j               exec $SCRIPT_joplin_start       ; mode "default"
  bindsym k               exec keepassxc                  ; mode "default"
  bindsym l               exec librewolf                  ; mode "default"
  bindsym n               exec kitty --class="$note" nvim +':AutoSession restore notes' ; mode "default"
  bindsym o               exec "picom-trans -s -t"        ; mode "default"
  bindsym p               exec "gthumb"                   ; mode "default"
  bindsym r               exec $SCRIPT_send_key --mark "$mark_quickswitch" 'ctrl+r' ; mode "default"
  bindsym s               exec $latex_screenshot shot     ; mode "default"
  bindsym t               exec xdotool getactivewindow set_window --role "focus_exclude" ; mode "default"
  bindsym x               exec $SCRIPT_key_mouse -k -r on ; mode "default"
  bindsym z               exec "$SCRIPT_zathura -O"       ; mode "default"

  bindsym Shift+b         exec "$SCRIPT_border"           ; mode "default"
  bindsym Shift+d         exec "$SCRIPT_dmenu -run-def"   ; mode "default"
  bindsym Shift+k         exec "$SCRIPT_kitty_session"    ; mode "default"
  bindsym Shift+l         exec libreoffice                ; mode "default"
  bindsym Shift+n         exec drawy                      ; mode "default"
  bindsym Shift+r         exec $SCRIPT_send_key --mark "$mark_quickswitch" 'ctrl+shift+r' ; mode "default"
  bindsym Shift+t         exec xdotool getactivewindow set_window --role "regular" ; mode "default"
  bindsym Shift+z         exec $SCRIPT_zathura -H         ; mode "default"
  bindsym Escape          mode "default"
